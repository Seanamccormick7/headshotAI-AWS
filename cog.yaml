# cog.yaml
build:
  gpu: true
  python_version: "3.10"
  system_packages:
    - git
    - libgl1-mesa-glx  # Required for OpenCV
    - libglib2.0-0
  python_packages:
    # From requirements.txt (exact versions preserved)
    - cog
    - torch>=2.0
    - torchvision
    - transformers>=4.25.1
    - diffusers>=0.14.0
    - safetensors>=0.3.0
    - accelerate>=0.14.0
    - xformers
    - ftfy
    - tqdm
    - Pillow
    - opencv-python-headless
    - tensorboard

    # Additional packages required by main.py/predict.py
    - fastapi         # For web server
    - uvicorn         # ASGI server
    - requests        # HTTP client
    - pyuploadcare    # Uploadcare integration
    - python-multipart  # For file uploads in FastAPI
    - bitsandbytes    # For 8-bit Adam
    - python-dotenv   # For environment variables (if used)

predict: "predict.py:Predictor"
